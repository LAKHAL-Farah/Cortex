---
- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Copy node_exporter archive from controller
  ansible.builtin.copy:
    src: "{{ node_exporter_archive }}"
    dest: "/tmp/{{ node_exporter_archive }}"
    mode: "0644"

- name: Extract node_exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_archive }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: node_exporter
    group: node_exporter
    mode: "0755"
  notify: restart node_exporter

- name: Allow node_exporter through UFW
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    from_ip: "{{ monitoring_network }}"
  when: ufw_enabled | default(false)

- name: Deploy node_exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    daemon_reload: true
    enabled: true
    state: started

- name: Remove temporary installation files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/{{ node_exporter_archive }}"
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

- name: Verify node_exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ node_exporter_port }}/metrics"
    return_content: false
  register: node_exporter_check
  retries: 3
  delay: 2
  until: node_exporter_check.status == 200