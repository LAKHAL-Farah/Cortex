---
- name: Deploy node_exporter on every node (controller, compute1/2, storage)
  hosts: monitoring
  become: true
  roles:
    - node_exporter

- name: Deploy Prometheus server on the controller
  hosts: prometheus_server
  become: true
  roles:
    - prometheus

- name: Deploy Loki on the logging controller
  hosts: loki_server
  become: true
  roles:
    - loki

- name: Deploy Promtail on every logging agent
  hosts: logging_agents
  become: true
  roles:
    - promtail

- name: Deploy Grafana on the controller
  hosts: grafana_server
  become: true
  roles:
    - grafana
