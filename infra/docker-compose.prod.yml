
networks:
  cortex-net:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${CORTEX_DB_PASSWORD}
      POSTGRES_DB: cortex
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cortex-net

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${CORTEX_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - cortex_neo4jdata:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cortex-net

  api:
    build:
      context: ../services/api
      network: host
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://cortex:${CORTEX_DB_PASSWORD}@postgres:5432/cortex
      CORTEX_API_KEY: ${CORTEX_API_KEY}
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET}
      CORTEX_JWT_TTL_MINUTES: ${CORTEX_JWT_TTL_MINUTES:-480}
      CORTEX_ADMIN_USERNAME: ${CORTEX_ADMIN_USERNAME:-admin}
      CORTEX_ADMIN_PASSWORD: ${CORTEX_ADMIN_PASSWORD:-admin}
      OS_CLIENT_CONFIG_FILE: /etc/openstack/clouds.yaml
      OS_CLOUD: ${OS_CLOUD:-cortex-reader}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${CORTEX_NEO4J_PASSWORD}
      # Container-side path, matching the `:/file_sd` mount below -- this was
      # previously set to the *host* dir (${PROMETHEUS_FILE_SD_HOST_DIR}),
      # which doesn't exist inside the container and isn't even a file path,
      # so every regenerate_file_sd() call after a node add/edit/delete was
      # silently failing and the original Ansible-provisioned nodes.json was
      # never being overwritten.
      PROMETHEUS_FILE_SD_PATH: /file_sd/nodes.json
      CORTEX_ANSIBLE_DIR: ${CORTEX_ANSIBLE_DIR:-/infra/ansible}
      # Used only to refuse startup if the resolved Ansible dir ever turns
      # out to be infra/ansible-sandbox -- see ansible_runner.py.
      CORTEX_ENV: production
      ANSIBLE_CONFIG: /infra/ansible/ansible.cfg
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      PROMETHEUS_RANGE_URL: ${PROMETHEUS_RANGE_URL}
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL}
      LOKI_URL: ${LOKI_URL}
      FORECAST_DATASET_REFRESH_INTERVAL_SECONDS: ${FORECAST_DATASET_REFRESH_INTERVAL_SECONDS:-86400}
      # RAG knowledge base (adr-0004) -- docs/knowledge/ is mounted read-only
      # below and embedded on demand into Qdrant Cloud (not a local container,
      # see QDRANT_URL) via POST /api/v1/knowledge/ingest.
      CORTEX_KNOWLEDGE_DIR: /app/docs/knowledge
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-cortex-knowledge}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Grounded chat generation over the RAG results above (adr-0005) --
      # NVIDIA NIM chat model called via LangChain's ChatNVIDIA. Only
      # POST /api/v1/knowledge/chat needs this; everything else still works
      # with NVIDIA_API_KEY unset.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      KNOWLEDGE_CHAT_MIN_SCORE: ${KNOWLEDGE_CHAT_MIN_SCORE:-0.2}
    volumes:
      - ../services/api:/app
      - ${PROMETHEUS_FILE_SD_HOST_DIR:-./.local-file-sd}:/file_sd
      - ${CORTEX_ANSIBLE_HOST_DIR:-../infra/ansible}:/infra/ansible
      - ${CORTEX_SSH_KEY_HOST_DIR:-./.sandbox-ssh}:/root/.ssh:ro
      - ${CORTEX_OPENSTACK_HOST_DIR:-./.local-openstack}:/etc/openstack:ro
      - ../docs/knowledge:/app/docs/knowledge:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - cortex-net
  web:
    build:
      context: ../services/web
      network: host
    environment:
      CORTEX_API_URL: http://api:8000
      CORTEX_API_KEY: ${CORTEX_API_KEY}
    ports:
      - "127.0.0.1:2990:3000"
    depends_on:
      - api
    networks:
      - cortex-net

volumes:
  cortex_pgdata:
  cortex_neo4jdata:
