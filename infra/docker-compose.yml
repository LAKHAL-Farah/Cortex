
networks:
  cortex-net:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${CORTEX_DB_PASSWORD}
      POSTGRES_DB: cortex
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
    networks:
      - cortex-net

  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg2://cortex:${CORTEX_DB_PASSWORD}@postgres:5432/cortex
      CORTEX_API_KEY: ${CORTEX_API_KEY}
      PROMETHEUS_FILE_SD_PATH: /file_sd/nodes.json
      CORTEX_ANSIBLE_DIR: ${CORTEX_ANSIBLE_DIR:-/infra/ansible}
    volumes:
      - ../services/api:/app
      - ${PROMETHEUS_FILE_SD_HOST_DIR:-./.local-file-sd}:/file_sd
      - ${CORTEX_ANSIBLE_HOST_DIR:-../infra/ansible}:/infra/ansible
      - ${CORTEX_SSH_KEY_HOST_DIR:-./.sandbox-ssh}:/root/.ssh:ro
    networks:
      - cortex-net

volumes:
  cortex_pgdata: