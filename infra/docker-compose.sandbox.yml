networks:
  cortex-sandbox:
    ipam:
      config:
        - subnet: 10.0.1.0/24
    driver: bridge
  cortex-sandbox-storage:
    ipam:
      config:
        - subnet: 10.0.2.0/24
    driver: bridge
services:
    # override: give api access to the fake-node networks, on top of cortex-net
  api:
    environment:
      PROMETHEUS_URL: http://prometheus:9090/api/v1/query
      LOKI_URL: http://controller-sim:3100
      CORTEX_ANSIBLE_HOST_DIR: /infra/ansible-sandbox
      CORTEX_ENV: sandbox
      # Gives the "admin" sandbox project (see openstack-sim's PROJECTS/
      # NOVA_ABSOLUTE_LIMITS seed data) a budget_cap to check its estimated
      # spend against, alongside the capacity_cap checks its Nova/Cinder
      # quotas already get for free -- so both alert kinds in
      # services/quota_budget_monitor.py have something real to fire on in
      # the sandbox, not just capacity_cap. 5 EUR is deliberately low: the
      # seed usage (18 vCPUs, 24 GB RAM, 160 GB volumes) already estimates
      # well over that at the default QUOTA_COST_PER_*_MONTH_EUR rates, so
      # a fresh sandbox has a budget_cap breach to look at immediately too.
      QUOTA_PROJECT_BUDGETS_EUR: '{"sandbox-project": 5, "admin": 5}'
      # Faster than the 300s production default, so a manual "Check now"
      # (or just waiting a bit) shows a result quickly during local testing.
      QUOTA_BUDGET_CHECK_INTERVAL_SECONDS: '60'
      # Same reasoning, for Phase Sec-1's security-group snapshot job
      # (services/security_snapshot_builder.py): 90s instead of the 900s
      # production default, so injecting a rule change via openstack-sim's
      # /_sandbox/security-group-rule/add|remove and then asking the
      # Security Agent shows up as real drift within a couple of polls
      # instead of a 15-minute wait. Use scripts/run_security_snapshot.py
      # for an on-demand pass instead of waiting even that long.
      SECURITY_SNAPSHOT_INTERVAL_SECONDS: '90'
      # Phase Sec-3: how often run_security_scan() refreshes
      # security_finding_cache (services/security_scan_cache.py) -- what
      # the /security and /security/security-groups pages actually poll.
      # Faster than the 45s production default so the "Scanned Xm ago"
      # badge and a fresh sandbox drift demo (POST /_sandbox/security-
      # group-rule/add via the Security groups page's "Simulate drift"
      # control) both show up within a couple of polls instead of
      # waiting a full production-length tick.
      SECURITY_SCAN_INTERVAL_SECONDS: '20'
      # Phase Sec-3: no dedicated package-inventory collector container in
      # this sandbox -- openstack-sim's own /packages route (see its
      # app.py, "Phase Sec-3" section) stands in for one, seeded with a
      # real vulnerable version on controller-sim and clean versions
      # everywhere else. Overrides the http://package-inventory:9111
      # production default (cve_feed.py), which has nothing listening on
      # it in this sandbox by design -- pointing this at a real collector
      # is the only change needed to make CVE-match read real data outside
      # the sandbox.
      CORTEX_PACKAGE_INVENTORY_URL: http://openstack-sim:5000
      # Reachable from the api container on the cortex-sandbox network --
      # same host:port openstacksdk's clouds.yaml already points at, just
      # addressed directly for the sandbox-only /_sandbox/... fault-
      # injection endpoints nothing in openstacksdk knows how to call
      # (see services/security_sandbox.py and openstack-sim/app.py's own
      # "sandbox-only fault injection" section).
      OPENSTACK_SIM_BASE_URL: http://openstack-sim:5000
      # Phase Sec-4: no real Falco/Tetragon sensor in this sandbox --
      # tetragon-bridge-sim (see its own README, "Phase Sec-4" section)
      # stands in for one, seeded with a real alert on compute1-sim
      # (compute-only pilot, per the roadmap doc's §13 recommendation) and
      # nothing on the other three nodes. Overrides the
      # http://tetragon-bridge:9110 production default (ebpf_signal.py),
      # which has nothing listening on it in this sandbox by design --
      # pointing this at a real sensor bridge is the only change needed to
      # make the eBPF-signal sub-check read real kernel-level data outside
      # the sandbox.
      CORTEX_EBPF_ALERTS_URL: http://tetragon-bridge-sim:9110
      # Phase Sec-5c: no dedicated keystone-audit collector container in
      # this sandbox either -- openstack-sim's own POST /v3/auth/tokens
      # already logs every issuance in-memory, and GET /_sandbox/keystone/
      # token-log (see its app.py, "Phase Sec-5c" section) reads that log
      # back out in the exact shape keystone_audit.get_token_issuance_log()
      # expects. Overrides the http://keystone-audit:9113 production
      # default (keystone_audit.py), which has no such service in this
      # sandbox's compose file at all -- without this override every call
      # fails to resolve the hostname and /security/keystone-tokens always
      # reports "no collector deployed yet", even though the sandbox has
      # been serving this route since Phase Sec-5c. Pointing this at a real
      # CADF-notification consumer or audit-middleware sidecar is the only
      # change needed to make this read real issuance events outside the
      # sandbox.
      CORTEX_KEYSTONE_TOKEN_LOG_URL: http://openstack-sim:5000

    volumes:
      - ../ansible-sandbox:/infra/ansible-sandbox
      # overrides the base file's /etc/openstack dir mount (which points at
      # CORTEX_OPENSTACK_HOST_DIR, real creds, prod-only) with a fake
      # clouds.yaml that points at openstack-sim below -- no real cluster,
      # no real credentials needed to test the topology graph locally.
      - ./openstack-sim/config:/etc/openstack:ro

    networks:
      - cortex-net
      - cortex-sandbox
      - cortex-sandbox-storage


  controller-sim:
    image: geerlingguy/docker-ubuntu2204-ansible
    hostname: controller-sim
    privileged: true
    cgroup: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./.sandbox-ssh/id_ed25519.pub:/root/.ssh_bootstrap/authorized_keys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      cortex-sandbox:
        ipv4_address: 10.0.1.20
    command: ["/bin/bash", "-c", "apt-get update && apt-get install -y openssh-server curl && mkdir -p /root/.ssh && cp /root/.ssh_bootstrap/authorized_keys /root/.ssh/authorized_keys && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service && exec /usr/sbin/init"]
  compute1-sim:
    image: geerlingguy/docker-ubuntu2204-ansible
    hostname: compute1-sim
    privileged: true
    cgroup: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./.sandbox-ssh/id_ed25519.pub:/root/.ssh_bootstrap/authorized_keys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      cortex-sandbox:
        ipv4_address: 10.0.1.21
    command: ["/bin/bash", "-c", "apt-get update && apt-get install -y openssh-server curl && mkdir -p /root/.ssh && cp /root/.ssh_bootstrap/authorized_keys /root/.ssh/authorized_keys && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service && exec /usr/sbin/init"]
  compute2-sim:
    image: geerlingguy/docker-ubuntu2204-ansible
    hostname: compute2-sim
    privileged: true
    cgroup: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./.sandbox-ssh/id_ed25519.pub:/root/.ssh_bootstrap/authorized_keys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      cortex-sandbox:
        ipv4_address: 10.0.1.22
    command: ["/bin/bash", "-c", "apt-get update && apt-get install -y openssh-server curl && mkdir -p /root/.ssh && cp /root/.ssh_bootstrap/authorized_keys /root/.ssh/authorized_keys && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service && exec /usr/sbin/init"]
  storage-sim:
    image: geerlingguy/docker-ubuntu2204-ansible
    hostname: storage-sim
    privileged: true
    cgroup: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./.sandbox-ssh/id_ed25519.pub:/root/.ssh_bootstrap/authorized_keys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      cortex-sandbox:
        ipv4_address: 10.0.1.23   # new address, gives storage-sim a route to controller-sim/loki
      cortex-sandbox-storage:
        ipv4_address: 10.0.2.20
    command: ["/bin/bash", "-c", "apt-get update && apt-get install -y openssh-server curl && mkdir -p /root/.ssh && cp /root/.ssh_bootstrap/authorized_keys /root/.ssh/authorized_keys && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service && exec /usr/sbin/init"]
  openstack-sim:
    # Fake Keystone/Nova/Neutron for local topology-graph testing -- see
    # openstack-sim/README.md. Not a real OpenStack; just enough surface
    # area for openstacksdk's list calls (hypervisors/services/networks/
    # subnets/routers/floatingips/agents) to succeed against seed data that
    # mirrors the compute1-sim/compute2-sim/controller-sim nodes above.
    build: ./openstack-sim
    hostname: openstack-sim
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      cortex-sandbox:
        ipv4_address: 10.0.1.30

  tetragon-bridge-sim:
    # Phase Sec-4: fake Falco-HTTP-output/Tetragon-bridge endpoint -- see
    # tetragon-bridge-sim/README.md. Not real eBPF; just enough of a
    # GET /alerts[?host=] surface for ebpf_signal.py's HTTP client to read
    # real (if synthetic) kernel-signal data instead of failing the
    # breaker on every call. A separate container rather than a route on
    # openstack-sim, unlike Sec-3's package-inventory collector -- a
    # kernel-level sensor bridge isn't an OpenStack API in any deployment,
    # real or simulated (see that module's own docstring for the full
    # reasoning).
    build: ./tetragon-bridge-sim
    hostname: tetragon-bridge-sim
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9110/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      CORTEX_ENV: sandbox
    ports:
      # Host-published for local curl testing only (see README's
      # "Verifying it directly" section) -- the api container reaches
      # this over the internal cortex-sandbox network by service name.
      - "127.0.0.1:9110:9110"
    networks:
      cortex-sandbox:
        ipv4_address: 10.0.1.31

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus:/etc/prometheus
      - ${PROMETHEUS_FILE_SD_HOST_DIR:-./.local-file-sd}:/file_sd
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - cortex-net           # not strictly needed, but lets you curl it from the api container if useful
      - cortex-sandbox        # to reach controller-sim / compute*-sim
      - cortex-sandbox-storage # to reach storage-sim