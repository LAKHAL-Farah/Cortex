---
- name: Install Promtail system dependencies
  ansible.builtin.apt:
    name:
      - unzip
      - ca-certificates
    state: present
    update_cache: true

- name: Create Promtail system group
  ansible.builtin.group:
    name: "{{ promtail_group }}"
    system: true
    state: present

- name: Create Promtail system user
  ansible.builtin.user:
    name: "{{ promtail_user }}"
    group: "{{ promtail_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
- name: Add promtail user to adm group (read access to system logs)
  ansible.builtin.user:
    name: "{{ promtail_user }}"
    groups: adm
    append: true
- name: Create Promtail directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ promtail_user }}"
    group: "{{ promtail_group }}"
    mode: "0755"
  loop:
    - "{{ promtail_config_dir }}"
    - "{{ promtail_data_dir }}"

- name: Download Promtail archive
  ansible.builtin.get_url:
    url: "{{ promtail_download_url }}"
    dest: "{{ promtail_archive_path }}"
    mode: "0644"
    force: false

- name: Extract Promtail binary
  ansible.builtin.unarchive:
    src: "{{ promtail_archive_path }}"
    dest: /tmp
    remote_src: true
    creates: "{{ promtail_extracted_binary }}"

- name: Install Promtail binary
  ansible.builtin.copy:
    src: "{{ promtail_extracted_binary }}"
    dest: /usr/local/bin/promtail
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Promtail

- name: Deploy Promtail configuration
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: "{{ promtail_config_dir }}/promtail.yml"
    owner: "{{ promtail_user }}"
    group: "{{ promtail_group }}"
    mode: "0644"
  notify: Restart Promtail

- name: Deploy Promtail systemd service
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Promtail

- name: Enable and start Promtail
  ansible.builtin.systemd:
    name: promtail
    enabled: true
    state: started
    daemon_reload: true

- name: Remove temporary Promtail archive
  ansible.builtin.file:
    path: "{{ promtail_archive_path }}"
    state: absent
