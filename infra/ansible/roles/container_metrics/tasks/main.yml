---
# Container-level telemetry for the Living Model (adr-0012). Runs on every
# `monitoring` node after node_exporter, which must have been started with
# --collector.textfile.directory=/var/lib/node_exporter/textfile (see the
# node_exporter role's unit). No new exporter, port, or Prometheus job.
- name: Ensure the node_exporter textfile directory exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the container scan script
  ansible.builtin.copy:
    src: cortex-container-metrics.sh
    dest: /usr/local/bin/cortex-container-metrics.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the systemd service
  ansible.builtin.template:
    src: cortex-container-metrics.service.j2
    dest: /etc/systemd/system/cortex-container-metrics.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Install the systemd timer
  ansible.builtin.template:
    src: cortex-container-metrics.timer.j2
    dest: /etc/systemd/system/cortex-container-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable and start the timer
  ansible.builtin.systemd:
    name: cortex-container-metrics.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Write the first sample now instead of waiting for the timer
  ansible.builtin.systemd:
    name: cortex-container-metrics.service
    state: started
  changed_when: false
