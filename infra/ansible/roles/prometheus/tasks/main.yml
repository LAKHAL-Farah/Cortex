---
- name: Create prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download prometheus archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Extract prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Install prometheus and promtool binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: restart prometheus

- name: Install consoles and console_libraries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/etc/prometheus/{{ item }}"
    remote_src: true
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - consoles
    - console_libraries

- name: Create file_sd directory for dynamic node-registry targets
  ansible.builtin.file:
    path: "{{ prometheus_file_sd_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"

- name: Deploy prometheus.yml scrape config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Validate prometheus.yml syntax
  ansible.builtin.command: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
  register: promtool_check
  changed_when: false

- name: Deploy prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    daemon_reload: true
    enabled: true
    state: started

- name: Clean up temporary download/extract artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    - "/tmp/prometheus-{{ prometheus_version }}.linux-amd64"
