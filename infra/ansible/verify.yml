---
# Automates the P0 checklist:
#   1.2 - curl :9100/metrics returns real data on all target nodes
#   1.3 - up{} == 1 for all nodes, with role labels present

- name: Verify node_exporter is reachable on every monitored node
  hosts: monitoring
  become: false
  tasks:
    - name: curl /metrics on this node
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ node_exporter_port }}/metrics"
        return_content: true
      register: metrics_check

    - name: Assert real metrics are present (not an empty/error page)
      ansible.builtin.assert:
        that:
          - "'node_cpu_seconds_total' in metrics_check.content"
        fail_msg: "node_exporter on {{ inventory_hostname }} did not return expected metrics"
        success_msg: "node_exporter OK on {{ inventory_hostname }} ({{ ansible_host }})"

- name: Verify Prometheus is scraping all targets successfully
  hosts: prometheus_server
  become: false
  tasks:
    - name: Query up{} from the Prometheus HTTP API
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ prometheus_port }}/api/v1/query?query=up"
        return_content: true
      register: prom_up

    - name: Show each target's status and labels
      ansible.builtin.debug:
        msg: "node={{ item.metric.node }} role={{ item.metric.role }} up={{ item.value[1] }}"
      loop: "{{ prom_up.json.data.result }}"
      loop_control:
        label: "{{ item.metric.node }}"

    - name: Assert every scraped target is up (value == '1')
      ansible.builtin.assert:
        that:
          - item.value[1] == "1"
        fail_msg: "Target {{ item.metric.node }} ({{ item.metric.role }}) is DOWN"
      loop: "{{ prom_up.json.data.result }}"
      loop_control:
        label: "{{ item.metric.node }}"

    - name: Assert we got one result per monitored node (nothing missing)
      ansible.builtin.assert:
        that:
          - prom_up.json.data.result | length >= groups['monitoring'] | length
        fail_msg: "Expected at least {{ groups['monitoring'] | length }} targets, got {{ prom_up.json.data.result | length }}"
