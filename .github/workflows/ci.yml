name: CI

# Supply-chain pipeline: gate -> build -> scan -> push -> SBOM -> sign -> attest.
# CI never deploys. The last job (optional) opens a PR in the gitops repo.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC: weekly rebuild picks up base-image/OS patches

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Gates marked "toggle" below are REPORT-ONLY while this is "false" so the
  # first run is not red because of pre-existing findings. Fix the findings,
  # then flip this to "true" to make them blocking.
  STRICT_GATES: "true"
  # Trivy is always blocking; add reviewed exceptions to .trivyignore.
  TRIVY_SEVERITY: "HIGH,CRITICAL"

jobs:
  # ------------------------------------------------------------------ gates
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          V=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks detect --source . --no-banner --redact --verbose

  lint-api:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - name: ruff check (toggle)
        continue-on-error: ${{ env.STRICT_GATES != 'true' }}
        run: ruff check services/api infra/collector

  lint-web:
    name: Lint + audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - name: eslint (toggle)
        continue-on-error: ${{ env.STRICT_GATES != 'true' }}
        run: npm run lint
      - name: npm audit, high+ (toggle)
        continue-on-error: ${{ env.STRICT_GATES != 'true' }}
        run: npm audit --omit=dev --audit-level=high

  test-api:
    name: Tests (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt

      - name: Install deps
        working-directory: services/api
        run: |
          # CPU-only torch first (same as the Dockerfile): avoids ~3 GB of CUDA wheels.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # TODO: pip-audit has not been measured on a clean run yet. Keep it report-only until the
      # first green run, then switch to the toggle expression (and add any reviewed
      # `--ignore-vuln <ID>` with a comment + expiry date).
      - name: Dependency audit (pip-audit, report-only for now)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: Run migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg2://cortex:cortex@localhost:5432/cortex_test
        run: alembic upgrade head

      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg2://cortex:cortex@localhost:5432/cortex_test
          CORTEX_API_KEY: test-key
          PROMETHEUS_FILE_SD_PATH: /tmp/prometheus_file_sd/nodes.json
        run: |
          mkdir -p /tmp/prometheus_file_sd
          pytest -v

      # v0.7 (adr-0009): the one eval step that calls the real router LLM, so it
      # only gates where NVIDIA_API_KEY is configured as an Actions secret.
      - name: Routing golden-set eval (gates router prompt changes)
        working-directory: services/api
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 scripts/eval_router_golden_set.py

  test-collector:
    name: Tests (collector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            infra/collector/requirements.txt
            infra/collector/requirements-dev.txt

      - name: Install deps
        working-directory: infra/collector
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Run from infra/collector: test_app.py imports `collector` as a sibling module.
      - name: Run tests
        working-directory: infra/collector
        run: pytest -q

  # --------------------------------------------- build / scan / sign / attest
  images:
    name: Image ${{ matrix.name }}
    needs: [secrets-scan, lint-api, lint-web, test-api, test-collector]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: services/api }
          - { name: web, context: services/web }
          - { name: collector, context: infra/collector }
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # cosign keyless + provenance (GitHub OIDC)
      attestations: write      # provenance attestation
      security-events: write   # Trivy SARIF upload
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cortex-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload Trivy SARIF to Security tab
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Trivy gate (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (only after the gate passed; layers come from cache)
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          provenance: false

      - name: SBOM (Syft, CycloneDX)
        if: env.PUSH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          artifact-name: sbom-${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'

      - name: Sign image (cosign keyless) + attach SBOM attestation
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx \
            --predicate "sbom-${{ matrix.name }}.cdx.json" "${IMAGE}@${DIGEST}"

      - name: Build provenance attestation (SLSA)
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record digest + verification command
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          echo "${DIGEST}" > "digests/${{ matrix.name }}"
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}

  # ------------------------------------------------ handoff (off by default)
  # Opens a PR in cortex-gitops that bumps image digests. Enable once that repo
  # exists: set repo variable GITOPS_HANDOFF=true and secret GITOPS_TOKEN
  # (fine-grained PAT: contents + pull-requests write on cortex-gitops only).
  gitops-handoff:
    name: Open digest-bump PR in cortex-gitops
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GITOPS_HANDOFF == 'true'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/cortex-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Bump digests in overlays/azure/kustomization.yaml
        working-directory: gitops
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in api web; do   # collector stays in the lab; not deployed to Azure
            export NAME="ghcr.io/${OWNER}/cortex-${svc}"
            export DIGEST="$(cat ../digests/${svc})"
            yq -i '(.images[] | select(.name == strenv(NAME)) | .digest) = strenv(DIGEST)' overlays/azure/kustomization.yaml
          done
          git diff --stat

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          branch: bot/bump-${{ github.sha }}
          commit-message: "chore(deploy): bump cortex images to ${{ github.sha }}"
          title: "chore(deploy): bump cortex images"
          body: |
            Automated digest bump from ${{ github.repository }}@${{ github.sha }}.
            Images are signed (cosign keyless) and carry SBOM + provenance attestations.
