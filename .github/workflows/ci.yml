name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        working-directory: services/api
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg2://cortex:cortex@localhost:5432/cortex_test
        run: alembic upgrade head

      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg2://cortex:cortex@localhost:5432/cortex_test
          CORTEX_API_KEY: test-key
          PROMETHEUS_FILE_SD_PATH: /tmp/prometheus_file_sd/nodes.json
        run: |
          mkdir -p /tmp/prometheus_file_sd
          pytest -v